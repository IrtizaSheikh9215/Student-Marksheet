<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">

<h1 class="h1">Student Marksheet</h1>

<input type="text" id="name"  placeholder="Student Name" />
<input type="number" id="sub1"  placeholder="Math Marks" />
<input type="number" id="sub2"  placeholder="Physics Marks" />
<input type="number" id="sub3"  placeholder="Chemistry Marks" />

<button onclick="result()">Calculate</button>

<div class="result">

 <p><strong>Name:</strong><span id="Name"></span></p>   
 <p><strong>Obtained Marks:</strong><span id="Total"></span></p> 
 <p><strong>Percentage:</strong><span id="Average"></span></p> 
 <p><strong>Grade:</strong><span id="Grade"></span></p> 
   
</div>
</div>     

<script src="index.js"></script>    
</body>
</html>
